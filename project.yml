name: LocalScan
options:
  bundleIdPrefix: com.kdnsna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LocalScan:
    type: application
    platform: iOS
    sources:
      - path: LocalScan
        excludes:
          - Resources/Models/UVDocCoreML.mlpackage
      - path: LocalScan/Resources/Models/UVDocCoreML.mlpackage
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdnsna.localscan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LocalScan
        INFOPLIST_KEY_NSCameraUsageDescription: "LocalScan 使用相机拍摄文档。所有处理都在本机完成，照片不会上传。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  LocalScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalScanTests
    dependencies:
      - target: LocalScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdnsna.localscan.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalScan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LocalScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LocalScan:
    build:
      targets:
        LocalScan: all
        LocalScanTests: [test]
    test:
      config: Debug
      gather_coverage_data: false
      targets:
        - LocalScanTests
